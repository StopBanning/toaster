# The Mac app, built on GitHub's Macs: on every release (the zip goes onto it, beside the Windows one)
# and on a push to mac-build (a test: the zip and a screenshot of it running, as the run's artifact).
# Signed with Toaster's own self-signed identity when the repo has it (secrets MAC_SIGN_P12, base64 of a .p12, and
# MAC_SIGN_PASSWORD; tools/release/SIGNING.md), else ad hoc. Either way a Mac asks before its first start (see the README); the
# identity is what keeps the Mac's answers (the keychain's Always Allow, the permissions) from one update to the next: an ad hoc
# signature is new with every build, so every update looked like a new app.
name: Mac build
on:
  release:
    types: [published]
  push:
    branches: [mac-build]
permissions:
  contents: write
jobs:
  mac:
    # a release whose tag isn't vX.Y.Z (splitter-1 holds the voice splitter's model) is a file store, not a build
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The voice splitter's model, from Toaster's own release, checked against its SHA-256
        run: node tools/fetch-splitter.mjs
      - run: npm run package:mac
      - name: Sign it (Toaster's own identity, else ad hoc), check it, zip it
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          V=$(node -p "require('./package.json').version")
          source tools/release/mac-signing.sh
          for ARCH in arm64 x64 universal; do
            APP="dist/Toaster-darwin-$ARCH/Toaster.app"
            codesign --force --deep "${KC[@]}" --sign "$ID" "$APP"
            codesign -d -r- "$APP" 2>&1 | grep designated
            codesign --verify --deep --strict --verbose=2 "$APP"
            lipo -archs "$APP/Contents/MacOS/Toaster"
            lipo -archs "$(find "$APP" -name nowplaying -type f | head -1)"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "Toaster-$V-mac-$ARCH.zip"
            ls -l "Toaster-$V-mac-$ARCH.zip"
          done
      - name: Start it, and a screenshot 25 s in
        run: |
          open dist/Toaster-darwin-universal/Toaster.app --args --use-mock-keychain --user-data-dir="$RUNNER_TEMP/toaster-smoke"
          sleep 25
          pgrep -lx Toaster
          screencapture -x shot.png || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: toaster-mac
          path: |
            Toaster-*-mac-*.zip
            shot.png
          if-no-files-found: ignore
      - name: Onto the release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" Toaster-*-mac-*.zip --clobber
          gh api "repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" > release.json
          node - <<'NODE'
          const { assets } = require('./release.json');
          const v = require('./package.json').version;
          for (const arch of ['arm64', 'x64', 'universal']) {
            const name = `Toaster-${v}-mac-${arch}.zip`;
            const asset = assets.find((a) => a.name === name);
            if (!/^sha256:[0-9a-f]{64}$/.test(asset?.digest || '')) throw new Error(`No GitHub SHA-256 digest for ${name}`);
          }
          NODE
        env:
          GH_TOKEN: ${{ github.token }}
